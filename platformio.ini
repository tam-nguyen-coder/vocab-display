; vocab-display -- TTGO T-Display (ESP32, ST7789 135x240)
;
;   pio run -t upload
;   pio device monitor
;
; The compiled-in deck and NVS progress are the offline floor: the device works on power
; alone. Wi-Fi is additive -- it fetches fresh entries from the host and reports progress
; back, and when the host is unreachable the board falls back to the compiled deck rather
; than showing an error.

[env:ttgo-t-display]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; 921600 makes the CH9102F drop the stream mid-flash; 460800 is reliable on this bridge.
upload_speed = 460800
; The default table gives the app 1.31MB, and Wi-Fi plus HTTPClient plus mDNS plus
; ArduinoJson put us at 92% of it -- too little headroom to add anything. huge_app trades
; the second OTA slot for a ~3MB single app partition, which costs nothing here because
; the board is flashed over USB.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    ; TFT_eSPI wiring for the T-Display, mirroring the library's own
    ; Setup25_TTGO_T_Display.h but kept here so the library folder stays untouched --
    ; edits inside .pio/libdeps are wiped on every dependency update.
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=135
    -D TFT_HEIGHT=240
    ; The 135x240 panel sits offset inside the controller's 240x320 RAM.
    -D CGRAM_OFFSET=1
    -D TFT_MISO=-1
    -D TFT_MOSI=19
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=23
    -D TFT_BL=4
    -D TFT_BACKLIGHT_ON=HIGH
    ; SMOOTH_FONT is what enables the VLW loader; the built-in fonts stay available for
    ; anything that does not need Vietnamese.
    -D SMOOTH_FONT=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=6000000

[env:debug-screenshot]
extends = env:ttgo-t-display
; Streams the framebuffer over serial so layouts can be checked against real pixels
; instead of squinting at a 1.14" panel. Not in the shipping build.
build_flags = ${env:ttgo-t-display.build_flags} -D VOCAB_DEBUG=1
monitor_speed = 460800
